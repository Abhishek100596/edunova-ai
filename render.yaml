services:
  - type: web
    name: edunova-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python ml/datasets/generate_dataset.py && python -m ml.training.train_placement && python scripts/seed_demo_data.py
    startCommand: gunicorn run:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: AI_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: AI_API_KEY
        sync: false
      - key: FLASK_DEBUG
        value: "false"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: edunova-db
          property: connectionString

databases:
  - name: edunova-db
    plan: free
